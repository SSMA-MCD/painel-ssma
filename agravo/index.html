let STATUS_OVERRIDES = {}; // id -> 'NC - Finalizada' (vindo do Sheets)
let DATA = []; // {id, sigla, pergunta, mov, resp}
let LAST_TOTALS = {};

function esc(s){ const d = document.createElement('div'); d.textContent = s===undefined||s===null? '': s; return d.innerHTML; }
function pctClass(p){ if (p>=0.80) return 'good'; if (p>=0.60) return 'mid'; return 'low'; }
function fmtPct(p){ return (p*100).toFixed(1) + '%'; }

function buildData(){
  DATA = SEED_DATA.map(r => {
    const [id, sigla, pergunta, movOriginal, resp] = r;
    const mov = STATUS_OVERRIDES.hasOwnProperty(id) ? STATUS_OVERRIDES[id] : movOriginal;
    return {id, sigla, pergunta, mov, resp};
  });
}

async function fetchStatuses(showSpinnerText){
  try {
    const res = await fetch(API_URL, {method:'GET'});
    const json = await res.json();
    STATUS_OVERRIDES = json || {};
    buildData();
    render();
    document.getElementById('syncDot').classList.remove('off');
    const now = new Date();
    document.getElementById('syncText').textContent = 'Sincronizado às ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  } catch(err){
    document.getElementById('syncDot').classList.add('off');
    document.getElementById('syncText').textContent = 'Sem conexão com a planilha — mostrando último estado carregado';
    if (DATA.length === 0){ buildData(); render(); }
  }
}

async function markDone(id, sigla){
  const item = DATA.find(d => d.id === id);
  if (!item) return;
  if (!confirm('Confirma que essa ação da loja ' + sigla + ' foi finalizada?\n\n' + item.pergunta)) return;
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.add('saving');
  try {
    await fetch(API_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({id, status:'NC - Finalizada'})
    });
    STATUS_OVERRIDES[id] = 'NC - Finalizada';
    buildData();
    render();
  } catch(err){
    alert('Não consegui salvar agora. Verifique sua internet e tente novamente.');
    if (el) el.classList.remove('saving');
  }
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const aoa = [['Sigla','Pergunta','Consultor de Operações','Movimentacao','Responsavel']];
  DATA.forEach(d => aoa.push([d.sigla, d.pergunta, STORE_CONSULTANT[d.sigla]||'', d.mov, d.resp]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:10},{wch:90},{wch:32},{wch:22},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'BASE');
  XLSX.writeFile(wb, 'BASE_AGRAVO_export.xlsx');
});

function computeTotals(rows){
  const t = rows.length;
  const f = rows.filter(r => r.mov === 'NC - Finalizada').length;
  const p = rows.filter(r => r.mov === 'NC - Sem Movimentação').length;
  return {t, f, p, pc: t ? f/t : 0};
}

function storeTableRows(storeList, byStore){
  const ranked = [...storeList].sort((a,b) => byStore[b].pc - byStore[a].pc);
  return ranked.map(s => {
    const tt = byStore[s];
    return `<tr><td>${esc(s)}</td><td>${tt.f}</td><td>${tt.p}</td><td class="pct ${pctClass(tt.pc)}">${fmtPct(tt.pc)}</td></tr>`;
  }).join('');
}

function storeDetailCards(storeList, byStore){
  const ranked = [...storeList].sort((a,b) => byStore[b].pc - byStore[a].pc);
  return ranked.map(s => {
    const pendItems = DATA.filter(d => d.sigla===s && d.mov==='NC - Sem Movimentação');
    if (pendItems.length===0){
      return `<div class="store-card"><div class="store-head done"><span class="name">Loja ${esc(s)}</span><span class="badge">100% concluído</span></div>
<div class="done-msg">Sem pendências — 100% concluído</div>
</div>`;
    }
    const items = pendItems.map((it,i) => {
      const tag = it.resp === 'MANUTENÇÃO' ? ' <span class="tag">(Manutenção)</span>' : '';
      return `<div class="item" data-id="${it.id}"><input type="checkbox" class="chk" title="Marcar como finalizada" onchange="markDone('${it.id}','${s}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="txt">${esc(it.pergunta)}${tag}</span></div>`;
    }).join('');
    const mailBody = encodeURIComponent(`Loja ${s} — ${pendItems.length} não conformidade(s) pendente(s):\n\n` + pendItems.map((it,i)=>`${i+1}. ${it.pergunta}${it.resp==='MANUTENÇÃO'?' (Manutenção)':''}`).join('\n'));
    const mailHref = `mailto:?subject=${encodeURIComponent('Agravo - Pendências Loja '+s)}&body=${mailBody}`;
    return `<div class="store-card"><div class="store-head"><span class="name">Loja ${esc(s)}</span><span class="badge">${pendItems.length} não conformidade(s) pendente(s)</span><button class="mailbtn" onclick="window.location.href='${mailHref}'">✉ e-mail</button></div>
<div class="items">
${items}
</div>
</div>`;
  }).join('');
}

  const manutPend = DATA.filter(d => d.resp === 'MANUTENÇÃO' && d.mov === 'NC - Sem Movimentação');
  const manutByStore = {};
  manutPend.forEach(d => { (manutByStore[d.sigla] = manutByStore[d.sigla] || []).push(d); });
  const manutStoresSorted = Object.keys(manutByStore).sort((a,b) => manutByStore[b].length - manutByStore[a].length);
  const summaryRows = manutStoresSorted.map(s => {
    const cons = CONSULTANTS.find(c => c.key === STORE_CONSULTANT[s]);
    return `<tr><td>${esc(s)}</td><td>${esc(cons?cons.label:'')}</td><td>${manutByStore[s].length}</td></tr>`;
  }).join('');

  let manutDetail = '';
  consRanked.forEach(c => {
    const storesHere = manutStoresSorted.filter(s => STORE_CONSULTANT[s] === c.key);
    if (storesHere.length===0) return;
    manutDetail += `<div class="section-title" style="margin-top:18px;color:var(--text);font-size:12.5px">${esc(c.label)}</div>`;
    storesHere.forEach(s => {
      const items = manutByStore[s].map((it,i) => `<div class="item" data-id="${it.id}"><input type="checkbox" class="chk" title="Marcar como finalizada" onchange="markDone('${it.id}','${s}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="txt">${esc(it.pergunta)}</span></div>`).join('');
      manutDetail += `<div class="store-card"><div class="store-head"><span class="name">Loja ${esc(s)}</span><span class="badge">${manutByStore[s].length} pendência(s) de manutenção</span></div><div class="items">
${items}
</div></div>`;
    });
  });

  panelsHtml += `<section class="panel${activeTab==='manut'?' active':''}" id="panel-manut">
${toolbar('manut','Manutenção')}
<div class="section-title">Resumo por loja (quantidade pendente em Manutenção)</div>
<table><thead><tr><th>Loja</th><th>Consultor</th><th>Qtd. pendente</th></tr></thead><tbody>
${summaryRows}
</tbody></table>
<div class="section-title">Detalhamento por consultor e loja</div>
${manutDetail}
</section>`;

  document.getElementById('panelsRoot').innerHTML = panelsHtml;

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

function buildSummaryText(tabKey, label){
  const t = LAST_TOTALS;
  if (tabKey === 'geral'){
    return `Painel Agravo - Reversões — Dashboard Geral\nTotal: ${t.overall.t} | Finalizadas: ${t.overall.f} | Pendentes: ${t.overall.p} | ${fmtPct(t.overall.pc)}`;
  }
  if (tabKey === 'manut'){
    return `Painel Agravo - Reversões — Manutenção`;
  }
  const cons = CONSULTANTS.find(c => c.tab === tabKey);
  const tt = t.consTotals[cons.key];
  return `Painel Agravo - Reversões — ${label}\nTotal: ${tt.t} | Finalizadas: ${tt.f} | Pendentes: ${tt.p} | ${fmtPct(tt.pc)}`;
}

function capturePanel(tabKey, label, action){
  const panel = document.getElementById('panel-' + tabKey);
  if (!panel){ return; }
  const overlay = document.getElementById('captureOverlay');
  const box = document.getElementById('captureBox');
  overlay.style.display = 'flex';

  const clone = panel.cloneNode(true);
  clone.classList.add('active');
  clone.querySelectorAll('.panel-toolbar').forEach(el => el.remove());
  clone.querySelectorAll('.mailbtn').forEach(el => el.remove());
  clone.querySelectorAll('.chk').forEach(el => el.remove());

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'width:920px;padding:24px;background:#fff;font-family:Arial,Helvetica,sans-serif;';
  const titleEl = document.createElement('div');
  titleEl.style.cssText = 'font-size:16px;font-weight:700;color:#1B3A5C;margin-bottom:14px;';
  titleEl.textContent = 'Painel Agravo - Reversões — ' + label;
  wrapper.appendChild(titleEl);
  wrapper.appendChild(clone);

  box.innerHTML = '';
  box.appendChild(wrapper);
  box.style.top = '0';
  box.style.left = '0';
  box.style.zIndex = '-1';

  const doCapture = () => {
    html2canvas(wrapper, {scale:2, backgroundColor:'#ffffff', useCORS:true}).then(canvas => {
      overlay.style.display = 'none';
      box.innerHTML = '';
      canvas.toBlob(blob => {
        const fileName = `Agravo_${tabKey}_${new Date().toISOString().slice(0,10)}.png`;
        const file = new File([blob], fileName, {type:'image/png'});
        const summary = buildSummaryText(tabKey, label);

        if (action === 'foto'){
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = fileName; a.click();
          URL.revokeObjectURL(url);
          return;
        }

        if (navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:'Painel Agravo', text: summary.replace(/\\n/g,'\n')}).catch(()=>{});
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName; a.click();
        URL.revokeObjectURL(url);

        const text = summary.replace(/\\n/g,'\n') + '\n\n(Anexe a imagem que acabou de ser baixada: ' + fileName + ')';
        if (action === 'email'){
          window.location.href = `mailto:?subject=${encodeURIComponent('Painel Agravo - '+label)}&body=${encodeURIComponent(text)}`;
        } else if (action === 'whatsapp'){
          window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
      }, 'image/png');
    });
  };

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => setTimeout(doCapture, 60));
  } else {
    setTimeout(doCapture, 150);
  }
}

// init
buildData();
render();
fetchStatuses();
setInterval(() => fetchStatuses(), POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchStatuses(); });
</script>
