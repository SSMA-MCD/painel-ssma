<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Auditor SSMA de Campo</title>
<meta name="theme-color" content="#17191b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auditor SSMA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg: #17191b;
  --panel: #1f2225;
  --panel-2: #262a2e;
  --line: #34383c;
  --ink: #ECE9E2;
  --ink-dim: #9a9d9f;
  --amber: #F5A623;
  --amber-ink: #17191b;
  --crit: #E5484D;
  --subst: #F2994A;
  --mod: #E8C547;
  --triv: #6FA3C9;
  --ok: #30A46C;
  --stripe-a: #F5A623;
  --stripe-b: #1f2225;
  --radius: 10px;
  --font-display: 'Barlow Condensed', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

.hazard-strip{
  height:6px;width:100%;
  background:repeating-linear-gradient(135deg, var(--stripe-a) 0 10px, var(--stripe-b) 10px 20px);
  flex-shrink:0;
}

header.topbar{
  padding:18px 18px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, #22262a 0%, var(--panel) 100%);
  position:relative;
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand-left{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(145deg, #2a2e32, #1b1e21);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.brand-mark svg{width:19px;height:19px;display:block;}
.brand h1{
  font-family:var(--font-display);
  font-weight:800;
  font-size:25px;
  letter-spacing:0.3px;
  margin:0;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
}
.brand h1 span{color:var(--amber);}
.brand .tag{
  font-family:var(--font-mono);
  font-size:9.5px;
  color:var(--ink-dim);
  text-transform:uppercase;
  letter-spacing:1px;
  border:1px solid var(--line);
  padding:4px 8px;
  border-radius:20px;
  white-space:nowrap;
  background:rgba(0,0,0,.15);
}
.profile-line{
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--ink-dim);
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.profile-line b{color:var(--ink);font-weight:600;}
.profile-line button{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
  font-family:var(--font-mono);font-size:10px;padding:4px 9px;border-radius:20px;cursor:pointer;
  transition:border-color .15s, color .15s, transform .1s;
}
.profile-line button:active{transform:scale(.96);}
.profile-line button:hover{border-color:var(--amber);color:var(--ink);}

nav.tabs{
  display:flex;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  scrollbar-width:none;
  box-shadow:0 4px 10px -6px rgba(0,0,0,.4);
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  flex:1;
  min-width:88px;
  background:none;border:none;color:var(--ink-dim);
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
  padding:13px 6px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .18s ease;
  position:relative;
}
nav.tabs button.active{color:var(--amber);}
nav.tabs button.active::after{
  content:'';position:absolute;left:14%;right:14%;bottom:-1px;height:2px;
  background:var(--amber);border-radius:2px 2px 0 0;
  box-shadow:0 0 8px rgba(245,166,35,.6);
}
nav.tabs button:active{color:var(--ink);}

main{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px;}
.view{display:none;}
.view.active{display:block;animation:fadein .3s cubic-bezier(.2,.8,.2,1);}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.card{
  background:linear-gradient(160deg, var(--panel) 0%, #1c1f22 100%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.02);
}
.card h2{
  font-family:var(--font-display);
  font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  margin:0 0 13px;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.card h2 .n{color:var(--amber);font-family:var(--font-mono);font-size:13px;}
label{
  display:block;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink-dim);margin:12px 0 5px;
}
label:first-child{margin-top:0;}
input[type=text],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 12px;border-radius:9px;font-family:var(--font-body);font-size:14.5px;
  transition:border-color .15s, box-shadow .15s;
}
textarea{resize:vertical;min-height:64px;}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.18);
}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.btn{
  font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  padding:11px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink);cursor:pointer;text-align:center;
  transition:transform .1s ease, border-color .15s, filter .15s;
}
.btn:hover{border-color:#454a4f;}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(155deg, #FFC15C, var(--amber));color:var(--amber-ink);border-color:var(--amber);
  font-weight:700;box-shadow:0 3px 10px rgba(245,166,35,.28);
}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:none;}
.btn-block{width:100%;display:block;}
.btn-sm{padding:7px 10px;font-size:10.5px;}
.btn-danger{color:var(--crit);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.06);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

.badge{
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  padding:4px 9px;border-radius:20px;display:inline-block;font-weight:700;
}
.badge-CRÍTICO{background:rgba(229,72,77,.16);color:var(--crit);box-shadow:inset 0 0 0 1px rgba(229,72,77,.25);}
.badge-SUBSTANCIAL{background:rgba(242,153,74,.16);color:var(--subst);box-shadow:inset 0 0 0 1px rgba(242,153,74,.25);}
.badge-MODERADO{background:rgba(232,197,71,.16);color:var(--mod);box-shadow:inset 0 0 0 1px rgba(232,197,71,.25);}
.badge-TRIVIAL{background:rgba(111,163,201,.16);color:var(--triv);box-shadow:inset 0 0 0 1px rgba(111,163,201,.25);}
.badge-ok{background:rgba(48,169,108,.16);color:var(--ok);}
.badge-neutral{background:var(--panel-2);color:var(--ink-dim);}

.dot-CRÍTICO{background:var(--crit);} .dot-SUBSTANCIAL{background:var(--subst);}
.dot-MODERADO{background:var(--mod);} .dot-TRIVIAL{background:var(--triv);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

.search-results{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--panel-2);}
.search-item{
  padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:#2e3237;}
.search-item .q{font-size:13px;color:var(--ink);margin-bottom:4px;line-height:1.35;}
.search-item .meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

.item-draft{border:1px solid rgba(245,166,35,.3);border-radius:12px;padding:14px;margin-top:10px;
  background:linear-gradient(160deg, #262a2e 0%, #1f2225 100%);box-shadow:0 4px 14px rgba(0,0,0,.25);}
.item-draft .close-x{float:right;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
  font-size:15px;cursor:pointer;width:26px;height:26px;border-radius:50%;line-height:1;}

.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-thumb{position:relative;width:74px;height:74px;border-radius:9px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(0,0,0,.3);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;
  border-radius:50%;width:19px;height:19px;font-size:11px;line-height:1;cursor:pointer;backdrop-filter:blur(2px);}
.photo-add{width:74px;height:74px;border:1.5px dashed #454a4f;border-radius:9px;background:var(--panel-2);color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:border-color .15s, color .15s;}
.photo-add:active{border-color:var(--amber);color:var(--amber);}

.ai-box{margin-top:8px;padding:11px;border-radius:10px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);}
.ai-box .lbl{font-family:var(--font-mono);font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.spinner{width:12px;height:12px;border:2px solid var(--amber);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.pending-item{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:10px;
  background:linear-gradient(160deg, #262a2e 0%, #222629 100%);box-shadow:0 2px 8px rgba(0,0,0,.18);
  transition:border-color .15s;}
.pending-item:hover{border-color:#454a4f;}
.pending-item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.pending-item .unit{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--ink);}
.pending-item .desc{font-size:13.5px;color:var(--ink);margin:6px 0;line-height:1.4;}
.pending-item .meta-row{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.status-pill{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;padding:2px 7px;border-radius:12px;letter-spacing:.4px;}
.status-aberto{background:rgba(229,72,77,.16);color:var(--crit);}
.status-em_andamento{background:rgba(232,197,71,.16);color:var(--mod);}
.status-corrigido{background:rgba(48,169,108,.16);color:var(--ok);}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:linear-gradient(160deg, #2a2e32, var(--panel-2));border:1px solid var(--line);border-radius:11px;padding:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.kpi .val{font-family:var(--font-display);font-size:31px;font-weight:800;color:var(--amber);line-height:1;
  text-shadow:0 0 18px rgba(245,166,35,.25);}
.kpi .lbl{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;color:var(--ink-dim);letter-spacing:.4px;margin-top:6px;}

.rank-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-row .pos{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);width:20px;}
.rank-row .name{flex:1;font-size:13.5px;}
.rank-row .bar-bg{width:70px;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.rank-row .bar-fg{height:100%;background:var(--ok);border-radius:4px;transition:width .4s ease;}
.rank-row .pct{font-family:var(--font-mono);font-size:11.5px;width:38px;text-align:right;}

.empty{text-align:center;padding:40px 18px;color:var(--ink-dim);}
.empty .ic{font-size:36px;margin-bottom:10px;filter:grayscale(.2) opacity(.85);}
.empty p{font-size:13px;line-height:1.6;margin:0;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--amber);color:var(--ink);
  padding:11px 18px;border-radius:11px;font-size:13px;font-family:var(--font-body);
  z-index:999;max-width:88%;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(245,166,35,.1);
  animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

.modal-overlay{position:fixed;inset:0;background:rgba(10,11,12,.7);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:900;animation:fadein .18s ease;}
.modal-sheet{background:linear-gradient(165deg, #23262a, var(--panel));border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;
  box-shadow:0 -8px 30px rgba(0,0,0,.4);animation:sheetup .25s cubic-bezier(.2,.8,.2,1);}
@keyframes sheetup{from{transform:translateY(24px);opacity:.6;}to{transform:none;opacity:1;}}
.modal-sheet::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-sheet h3{font-family:var(--font-display);font-size:21px;text-transform:uppercase;margin:0 0 12px;}

.divider-hazard{height:4px;background:repeating-linear-gradient(135deg, var(--stripe-a) 0 8px, var(--stripe-b) 8px 16px);
  border-radius:2px;margin:16px 0;opacity:.7;}

.section-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);margin:0 0 8px;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

@media (min-width:640px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);}
}
</style>
</head>
<body>
<div id="app">
  <div class="hazard-strip"></div>
  <header class="topbar">
    <div class="brand">
      <div class="brand-left">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5V11C4 16 7.5 20.5 12 22C16.5 20.5 20 16 20 11V5L12 2Z" fill="#F5A623"/>
            <path d="M8.5 12.2L10.8 14.5L15.5 9.5" stroke="#17191b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Auditor<span>SSMA</span></h1>
      </div>
      <span class="tag">Norte/Nordeste · 43 unid.</span>
    </div>
    <div class="profile-line" id="profileLine"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="audit" class="active">Nova Auditoria</button>
    <button data-view="pending">Oportunidades</button>
    <button data-view="dashboard">Painel</button>
    <button data-view="history">Histórico</button>
  </nav>

  <main id="views"></main>

<script>
/* ===================== DADOS ===================== */
const CATALOG = JSON.parse(document.getElementById('catalog-data').textContent);
const MANAGERS = JSON.parse(document.getElementById('managers-data').textContent);
const CONSULTORES = [...new Set(MANAGERS.map(m => m.consultor).filter(Boolean))].sort();
const CRIT_ORDER = ['CRÍTICO','SUBSTANCIAL','MODERADO','TRIVIAL'];

function norm(s){
  return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Converte texto majoritariamente em CAIXA ALTA para "Frase com inicial maiúscula",
   preservando siglas/textos já corretos. Serve como rede de segurança independente
   do texto vindo da IA ou do catálogo AGravO (que é todo em maiúsculas). */
function toSentenceCase(text){
  if(!text) return text;
  const letters = text.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  const upper = letters.replace(/[^A-ZÀ-Ö]/g,'');
  if(letters.length < 3 || upper.length/letters.length < 0.7) return text; // já não está em caixa alta
  let out = text.toLowerCase();
  out = out.replace(/(^\s*[a-zà-ÿ])|([\.\!\?]\s+[a-zà-ÿ])/g, m => m.toUpperCase());
  return out;
}

/* Extrai trechos de referência de fornecedor/código de peça de um texto (ex: catálogo AGravO),
   para garantir que essas informações nunca se percam ao reescrever a descrição/ação. */
function extractCodigosProduto(referencia){
  if(!referencia) return '';
  const partes = referencia.split(/\s*\/\s*/).map(p=>p.trim()).filter(Boolean);
  const relevantes = partes.filter(p => /CÓDIGO|FORNECEDOR/i.test(p));
  return relevantes.join(' / ');
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== TOAST ===================== */
let toastTimer = null;
function toast(msg, ms=2600){
  let el = document.querySelector('.toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.remove(), ms);
}

/* ===================== STORAGE (local no aparelho, via localStorage) ===================== */
/* App instalado como PWA. Por padrão os dados ficam salvos neste celular/navegador.
   É possível configurar uma "nuvem" no GitHub (repositório privado) em "☁ Nuvem" no
   topo da tela — aí as auditorias passam a ficar centralizadas e visíveis para
   todo o time, em vez de isoladas por aparelho. */
const LS_PREFIX = 'auditorssma:';
const CLOUD_DATA_DIR = 'ssma-auditor-data';

function isCloudKey(key){
  return key === 'index:auditorias' || key.startsWith('auditoria:');
}
function cloudPathFor(key){
  if(key === 'index:auditorias') return 'index.json';
  return `auditorias/${key.slice('auditoria:'.length)}.json`;
}
async function getCloudConfig(){
  try{
    const raw = localStorage.getItem(LS_PREFIX + 'config:cloud');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function setCloudConfig(cfg){
  localStorage.setItem(LS_PREFIX + 'config:cloud', JSON.stringify(cfg));
}
function cloudReady(cfg){
  return !!(cfg && cfg.token && cfg.owner && cfg.repo);
}
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }

async function ghApi(pathInRepo, method, body, cfg){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${CLOUD_DATA_DIR}/${pathInRepo}` +
    (method === 'GET' ? `?ref=${encodeURIComponent(cfg.branch || 'main')}` : '');
  return fetch(url, {
    method,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
}
async function ghGetFile(pathInRepo, cfg){
  const resp = await ghApi(pathInRepo, 'GET', null, cfg);
  if(resp.status === 404) return null;
  if(!resp.ok) throw new Error(`GitHub: erro ${resp.status} ao ler`);
  const data = await resp.json();
  return { content: base64ToUtf8(data.content), sha: data.sha };
}
async function ghPutFile(pathInRepo, contentStr, sha, cfg, message){
  const body = { message: message || `Atualiza ${pathInRepo}`, content: utf8ToBase64(contentStr), branch: cfg.branch || 'main' };
  if(sha) body.sha = sha;
  const resp = await ghApi(pathInRepo, 'PUT', body, cfg);
  if(!resp.ok){
    const data = await resp.json().catch(()=>({}));
    throw new Error(`GitHub: ${data.message || ('erro ' + resp.status)}`);
  }
  return (await resp.json()).content.sha;
}
async function ghDeleteFile(pathInRepo, sha, cfg, message){
  const body = { message: message || `Remove ${pathInRepo}`, sha, branch: cfg.branch || 'main' };
  const resp = await ghApi(pathInRepo, 'DELETE', body, cfg);
  if(!resp.ok){
    const data = await resp.json().catch(()=>({}));
    throw new Error(`GitHub: ${data.message || ('erro ' + resp.status)}`);
  }
  return true;
}
async function cloudPutJSON(pathInRepo, contentStr, cfg){
  let sha = null;
  try{ const existing = await ghGetFile(pathInRepo, cfg); if(existing) sha = existing.sha; }catch(e){}
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{ return await ghPutFile(pathInRepo, contentStr, sha, cfg); }
    catch(e){
      lastErr = e;
      try{ const existing = await ghGetFile(pathInRepo, cfg); sha = existing ? existing.sha : null; }catch(e2){}
    }
  }
  throw lastErr;
}

async function sGet(key){
  if(isCloudKey(key)){
    const cfg = await getCloudConfig();
    if(cloudReady(cfg)){
      try{
        const file = await ghGetFile(cloudPathFor(key), cfg);
        return file ? file.content : null;
      }catch(e){ console.error(e); toast('Erro ao ler da nuvem do GitHub: ' + e.message); return null; }
    }
  }
  try{ return localStorage.getItem(LS_PREFIX + key); }catch(e){ return null; }
}
async function sSet(key, value){
  if(isCloudKey(key)){
    const cfg = await getCloudConfig();
    if(cloudReady(cfg)){
      try{ await cloudPutJSON(cloudPathFor(key), value, cfg); return true; }
      catch(e){ console.error(e); toast('Não foi possível salvar na nuvem do GitHub: ' + e.message); return false; }
    }
  }
  try{ localStorage.setItem(LS_PREFIX + key, value); return true; }
  catch(e){ console.error('storage set failed', key, e); toast('Armazenamento cheio ou indisponível — tente exportar um backup e limpar auditorias antigas.'); return false; }
}
async function sDelete(key){
  if(isCloudKey(key)){
    const cfg = await getCloudConfig();
    if(cloudReady(cfg)){
      try{
        const existing = await ghGetFile(cloudPathFor(key), cfg);
        if(existing) await ghDeleteFile(cloudPathFor(key), existing.sha, cfg);
        return true;
      }catch(e){ console.error(e); toast('Erro ao excluir na nuvem do GitHub: ' + e.message); return false; }
    }
  }
  try{ localStorage.removeItem(LS_PREFIX + key); return true; }catch(e){ return false; }
}
async function sList(prefix){
  const cfg = await getCloudConfig();
  if(cloudReady(cfg) && (!prefix || 'auditoria:'.startsWith(prefix) || prefix.startsWith('auditoria:') || prefix === '')){
    try{
      const out = ['index:auditorias'];
      const resp = await ghApi('auditorias', 'GET', null, cfg);
      if(resp.ok){
        const arr = await resp.json();
        (Array.isArray(arr) ? arr : []).forEach(f=>{
          if(f.name.endsWith('.json')) out.push('auditoria:' + f.name.replace(/\.json$/,''));
        });
      }
      return out.filter(k => !prefix || k.startsWith(prefix));
    }catch(e){ return []; }
  }
  try{
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX + (prefix||''))) out.push(k.slice(LS_PREFIX.length));
    }
    return out;
  }catch(e){ return []; }
}

function openCloudConfigModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Nuvem no GitHub</h3>
      <p style="font-size:12.5px;color:var(--ink-dim);line-height:1.5;">
        Centraliza as auditorias em um repositório do GitHub (recomendado: privado), para todo

async function exportBackup(){

  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const a = document.createElement('a');

  a.download = `backup_auditor_ssma_${todayISO()}.json`;
  a.click();
  toast('Backup exportado');
}
async function importBackupFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const idxRaw = data['index:auditorias'];
    if(idxRaw){
      const incoming = JSON.parse(idxRaw);
      const currentRaw = await sGet('index:auditorias');
      const current = currentRaw ? JSON.parse(currentRaw) : [];
      const ids = new Set(current.map(a=>a.id));
      incoming.forEach(a=>{ if(!ids.has(a.id)){ current.push(a); ids.add(a.id); } });
      await sSet('index:auditorias', JSON.stringify(current));
    }
    for(const k of Object.keys(data)){
      if(k.startsWith('auditoria:')) await sSet(k, data[k]);
    }
    toast('Backup importado com sucesso');
  }catch(e){ toast('Arquivo de backup inválido'); }
}

/* ===================== IMAGE HELPERS ===================== */
function compressImage(file, maxDim=1000, quality=0.62){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', width, height });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===================== CONFIGURAÇÃO DA IA (chave de API gratuita do Google AI Studio) ===================== */
/* Fora do ambiente do Claude.ai, a chamada à IA usa a API do Gemini (Google AI Studio),
   que tem camada gratuita sem cartão de crédito. A chave fica salva só neste aparelho. */
const GEMINI_MODEL = 'gemini-3.5-flash-lite';
async function getApiKey(){
  return (await sGet('config:apiKey')) || '';
}
async function setApiKey(key){
  return sSet('config:apiKey', key.trim());
}
async function callGemini(parts, maxTokens){
  const key = await getApiKey();
  if(!key){
    const err = new Error('SEM_CHAVE');
    err.code = 'SEM_CHAVE';
    throw err;
  }
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: { responseMimeType: 'application/json', maxOutputTokens: maxTokens || 500 }
    })
  });
  const data = await resp.json();
  if(!resp.ok){
    const msg = (data && data.error && data.error.message) || `Erro ${resp.status} na chamada da IA`;
    const err = new Error(msg);
    err.code = 'API_ERRO';
    throw err;
  }
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('') : '';
  if(!text){
    const err = new Error('A IA não retornou conteúdo (pode ter sido bloqueada por segurança do próprio Google)');
    err.code = 'API_ERRO';
    throw err;
  }
  return text;
}

/* ===================== IA - ANÁLISE DE FOTO ===================== */
async function analisarFotoIA(base64, mediaType, perguntaContexto){
  const prompt = `Você é um técnico especialista em Segurança do Trabalho (SSMA) redigindo laudos de auditoria de campo para restaurantes. Analise a foto abaixo.
${perguntaContexto ? `Item do checklist relacionado: "${perguntaContexto}"` : 'Nenhum item específico de checklist foi pré-selecionado — identifique a não conformidade mais evidente na imagem.'}

Responda SOMENTE com um objeto JSON válido, sem markdown, sem texto antes ou depois, no formato exato:
{"descricao":"...","grupo":"DOCUMENTAÇÃO|COMPORTAMENTO|ESTRUTURA","criticidade":"TRIVIAL|MODERADO|SUBSTANCIAL|CRÍTICO","planoAcao":"..."}

Critérios de criticidade:
- CRÍTICO: risco iminente à vida/integridade física, ou violação legal grave
- SUBSTANCIAL: risco relevante porém não iminente
- MODERADO: desvio operacional que requer correção
- TRIVIAL: observação administrativa ou de baixo impacto

Regras de redação (siga rigorosamente, é o padrão do relatório):
- "descricao" deve nomear o equipamento/item específico visível na foto seguido do problema identificado, em frase curta, direta e objetiva. Use apenas a primeira letra maiúscula (início de frase), o restante em minúsculas — nunca escreva em caixa alta. NUNCA use frases genéricas como "item fora do padrão" ou "não conformidade identificada" sem dizer qual é o problema concreto.
- "planoAcao" deve ser uma frase curta e imperativa com a ação corretiva concreta para aquele item específico, também com apenas a primeira letra maiúscula, sem caixa alta.
- Exemplo do padrão esperado (apenas referência de tom e formato, não copie o conteúdo): descricao="Processador de bacon danificado.", planoAcao="Realizar a substituição do triturador."
- Seja técnico, específico e conciso. Evite adjetivos vagos.`;

  const text = await callGemini([
    { text: prompt },
    { inline_data: { mime_type: mediaType, data: base64 } }
  ], 500);
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  if(parsed.descricao) parsed.descricao = toSentenceCase(parsed.descricao);
  if(parsed.planoAcao) parsed.planoAcao = toSentenceCase(parsed.planoAcao);
  return parsed;
}

/* ===================== IA - TEXTO AUTOMÁTICO (sem foto, a partir do item do checklist) ===================== */
async function gerarDescricaoAutomatica(it){
  const prompt = `Você é um técnico especialista em Segurança do Trabalho (SSMA) redigindo laudos de auditoria de campo para restaurantes (rede McDonald's).

Dados do item identificado na auditoria:
- Item do checklist (pergunta original): "${it.perguntaRef || '(não informado)'}"
- Bloco/equipamento: "${it.bloco || '(não informado)'}"
- Área: "${it.area || '(não informada)'}"
- Grupo: "${it.grupo || '(não informado)'}"
- Criticidade: "${it.criticidade}"
- Plano de ação de referência do manual (pode reformular e tornar mais específico): "${it.planoAcao || '(nenhum)'}"

Responda SOMENTE com um objeto JSON válido, sem markdown, sem texto antes ou depois, no formato exato:
{"descricao":"...","planoAcao":"..."}

Regras de redação (siga rigorosamente, é o padrão do relatório):
- "descricao" deve nomear o equipamento/item específico seguido do problema identificado, em frase curta, direta e objetiva — como se o auditor tivesse acabado de constatar o desvio em campo. Use apenas a primeira letra maiúscula (início de frase), o restante em minúsculas — nunca escreva em caixa alta. NUNCA genérico.
- "planoAcao" deve ser uma frase curta e imperativa com a ação corretiva concreta para aquele item específico, baseada no plano de ação de referência mas reescrita de forma direta, também com apenas a primeira letra maiúscula, sem caixa alta. Se o plano de ação de referência contiver códigos de peça, fornecedor ou "CÓDIGO:", preserve essas referências (fornecedor e código) no final do texto reescrito, mesmo reformulando o restante.
- Exemplo do padrão esperado (apenas referência de tom e formato, não copie o conteúdo): descricao="Processador de bacon danificado.", planoAcao="Realizar a substituição do triturador."
- Seja técnico, específico e conciso — no máximo 1-2 frases curtas em cada campo. Evite adjetivos vagos.`;

  const text = await callGemini([{ text: prompt }], 300);
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  if(parsed.descricao) parsed.descricao = toSentenceCase(parsed.descricao);
  if(parsed.planoAcao) parsed.planoAcao = toSentenceCase(parsed.planoAcao);
  return parsed;
}

    <input type="search" id="catBusca" placeholder="Buscar por palavra, bloco ou área (ex: fritadeira, EPI, câmara fria)">
    <div class="search-results" id="catResults"></div>
    <div class="btn-row">
      <button class="btn btn-ghost btn-sm" id="btnItemLivre">+ Adicionar item sem usar o checklist</button>
    </div>
    <div id="itemDraftZone"></div>
  </div>

  <div class="card">
    <h2>3 · Itens adicionados <span class="n">${draft.itens.length}</span></h2>
    ${draft.itens.length === 0 ? `<div class="empty" style="padding:14px;"><p>Nenhuma não conformidade adicionada ainda.</p></div>` : draft.itens.map((it,idx)=>`
      <div class="pending-item">
        <div class="top">
          <div>
            <span class="badge badge-${it.criticidade}">${it.criticidade}</span>
            <div style="font-family:var(--font-display);font-size:16px;font-weight:700;margin-top:6px;">${escapeHtml(it.bloco || 'Item')}${it.area ? ' · '+escapeHtml(it.area) : ''}</div>
            ${it.perguntaRef ? `<div style="font-size:11.5px;color:var(--ink-dim);margin-top:2px;">${escapeHtml(it.perguntaRef)}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button class="btn btn-sm" data-edit-item="${it.id}">Editar</button>
            <button class="btn btn-sm btn-danger" data-rm-item="${it.id}">Remover</button>
          </div>
        </div>
        <div class="desc">${escapeHtml(it.descricao || '(sem descrição)')}</div>
        <div class="meta-row">
          <span>Responsável pela correção: ${escapeHtml(draft.gerenteNome || '—')}</span>
          <span>${it.fotos.length} foto(s)</span>
        </div>
      </div>
    `).join('')}
    ${draft.itens.length > 0 ? `<button class="btn btn-primary btn-block" id="btnFinalizar">Finalizar auditoria e gerar relatório</button>` : ''}
  </div>
  ` : ''}
  `;
}

function bindAuditView(){
  if(!draft) return;
  const gerBusca = document.getElementById('gerBusca');
  if(gerBusca){
    gerBusca.addEventListener('input', ()=>{
      const q = norm(gerBusca.value);
      const results = document.getElementById('gerResults');
      if(q.length < 2){ results.innerHTML=''; return; }
      const matches = MANAGERS.filter(m => norm(m.nome).includes(q) || norm(m.id).includes(q) || norm(m.unidade).includes(q)).slice(0,8);
      results.innerHTML = matches.map(m => `
        <div class="search-item" data-id="${m.id}">
          <div class="q">${escapeHtml(m.nome)}</div>
          <div class="meta"><span>Crachá ${escapeHtml(m.id)}</span><span>·</span><span>${escapeHtml(m.unidade)}</span><span>·</span><span>${escapeHtml(m.consultor)}</span></div>
        </div>`).join('') || `<div class="search-item">Nenhum gerente encontrado</div>`;
      results.querySelectorAll('.search-item[data-id]').forEach(it=>{
        it.onclick = ()=>{
          const m = MANAGERS.find(x=>x.id===it.dataset.id);
          draft.unidade = m.unidade; draft.gerenteId = m.id; draft.gerenteNome = m.nome; draft.consultor = m.consultor;
          renderAndBind();
        };
      });
    });
  }
  const btnTrocar = document.getElementById('btnTrocarUnidade');
  if(btnTrocar) btnTrocar.onclick = ()=>{ draft.unidade=null; draft.gerenteId=null; draft.gerenteNome=null; draft.consultor=null; renderAndBind(); };

  const tipoAud = document.getElementById('tipoAud');
  if(tipoAud) tipoAud.onchange = ()=> draft.tipo = tipoAud.value;
  const dataAud = document.getElementById('dataAud');
  if(dataAud) dataAud.onchange = ()=> draft.data = dataAud.value;
  const auditorNome = document.getElementById('auditorNome');
  if(auditorNome) auditorNome.onchange = ()=> draft.auditor = auditorNome.value;

  const catBusca = document.getElementById('catBusca');
  if(catBusca){
    catBusca.addEventListener('input', ()=>{
      const q = norm(catBusca.value);
      const results = document.getElementById('catResults');
      if(q.length < 2){ results.innerHTML=''; return; }
      const matches = CATALOG.filter(c => norm(c.pergunta).includes(q) || norm(c.bloco).includes(q) || norm(c.area).includes(q)).slice(0,15);
      results.innerHTML = matches.map((c) => `
        <div class="search-item" data-idx="${CATALOG.indexOf(c)}">
          <div class="q">${escapeHtml(c.pergunta)}</div>
          <div class="meta">
            <span class="dot dot-${c.criticidade}"></span>
            <span>${escapeHtml(c.criticidade)}</span><span>·</span>
            <span>${escapeHtml(c.bloco)}</span><span>·</span><span>${escapeHtml(c.tipo)}</span>
          </div>
        </div>`).join('') || `<div class="search-item">Nenhum item encontrado — use "adicionar item sem checklist"</div>`;
      results.querySelectorAll('.search-item[data-idx]').forEach(it=>{
        it.onclick = ()=>{
          itemDraft = newItemDraft(CATALOG[it.dataset.idx]);
          catBusca.value=''; results.innerHTML='';
          renderItemDraftZone();
          autoGerarDescricao(false);
        };
      });
    });
  }
  const btnItemLivre = document.getElementById('btnItemLivre');
  if(btnItemLivre) btnItemLivre.onclick = ()=>{ itemDraft = newItemDraft(null); renderItemDraftZone(); };

  document.querySelectorAll('[data-rm-item]').forEach(b=>{
    b.onclick = ()=>{
      draft.itens = draft.itens.filter(i => i.id !== b.dataset.rmItem);
      renderAndBind();
    };
  });
  document.querySelectorAll('[data-edit-item]').forEach(b=>{
    b.onclick = ()=>{
      const found = draft.itens.find(i => i.id === b.dataset.editItem);
      if(!found) return;
      draft.itens = draft.itens.filter(i => i.id !== b.dataset.editItem);
      itemDraft = found;
      renderAndBind();
      const zone = document.getElementById('itemDraftZone');
      if(zone) zone.scrollIntoView({ behavior:'smooth', block:'start' });
    };
  });
  const btnFinalizar = document.getElementById('btnFinalizar');
  if(btnFinalizar) btnFinalizar.onclick = finalizarAuditoria;

  if(itemDraft) renderItemDraftZone();
}

function renderAndBind(){
  document.getElementById('views').innerHTML = renderAuditView();
  bindAuditView();
}

function renderItemDraftZone(){
  const zone = document.getElementById('itemDraftZone');
  if(!zone || !itemDraft) return;
  const it = itemDraft;
  zone.innerHTML = `
    <div class="item-draft">
      <button class="close-x" id="btnFecharItem">×</button>
      <label>Bloco / Área</label>
      <div class="row">
        <input type="text" id="itBloco" value="${escapeHtml(it.bloco)}" placeholder="Bloco">
        <input type="text" id="itArea" value="${escapeHtml(it.area)}" placeholder="Área">
      </div>
      <label>Criticidade</label>
      <select id="itCrit">
        ${CRIT_ORDER.map(c=>`<option value="${c}" ${it.criticidade===c?'selected':''}>${c}</option>`).join('')}
      </select>

      <label>Fotos da evidência</label>
      <div class="photo-grid" id="itFotos"></div>
      <input type="file" accept="image/*" capture="environment" id="itFotoCamInput" style="display:none" multiple>
      <input type="file" accept="image/*" id="itFotoGalInput" style="display:none" multiple>

      <div id="iaGeraIndicator" class="ai-box" style="display:none;"><div class="lbl"><span class="spinner"></span> Gerando descrição automática com IA…</div></div>

      <label style="display:flex;justify-content:space-between;align-items:center;">
        <span>Descrição da não conformidade</span>
        <button type="button" class="btn btn-sm" id="btnGerarDesc" style="text-transform:none;">✨ Gerar automaticamente</button>
      </label>
      <textarea id="itDesc" placeholder="Ex: Processador de bacon danificado.">${escapeHtml(it.descricao)}</textarea>

      <label>Plano de ação</label>
      <textarea id="itPlano" placeholder="Ex: Realizar a substituição do triturador.">${escapeHtml(it.planoAcao)}</textarea>
      ${it.codigosProduto ? `<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);margin-top:4px;">📦 Peça/fornecedor de referência (incluído automaticamente no PDF): ${escapeHtml(it.codigosProduto)}</div>` : ''}

      <label>Observações adicionais</label>
      <textarea id="itObs" placeholder="Use este campo para complementar qualquer informação que falte no item (ex: detalhe do local, contexto, item fora do checklist)">${escapeHtml(it.observacoes)}</textarea>

      <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);margin-top:6px;">
        O responsável pela correção é sempre o(a) gerente da unidade (${escapeHtml(draft.gerenteNome || '—')}). O prazo é definido fora da plataforma.
      </div>

      <button class="btn btn-primary btn-block" id="btnAddItem" style="margin-top:14px;">Adicionar item à auditoria</button>
    </div>
  `;
  renderItemFotos();

  zone.querySelector('#btnFecharItem').onclick = ()=>{ itemDraft = null; zone.innerHTML=''; };
  zone.querySelector('#itBloco').onchange = e=> it.bloco = e.target.value;
  zone.querySelector('#itArea').onchange = e=> it.area = e.target.value;
  zone.querySelector('#itCrit').onchange = e=> it.criticidade = e.target.value;
  zone.querySelector('#itDesc').addEventListener('input', e=>{ it.descricao = e.target.value; it.descEditado = true; });
  zone.querySelector('#itPlano').addEventListener('input', e=>{ it.planoAcao = e.target.value; it.planoEditado = true; });
  zone.querySelector('#btnGerarDesc').onclick = ()=> autoGerarDescricao(true);
  zone.querySelector('#itObs').onchange = e=> it.observacoes = e.target.value;

  const camInput = zone.querySelector('#itFotoCamInput');
  const galInput = zone.querySelector('#itFotoGalInput');
  async function handleFiles(e){
    const files = Array.from(e.target.files || []);
    for(const f of files){
      try{
        const { dataUrl, width, height } = await compressImage(f);
        it.fotos.push({ dataUrl, aiStatus:'idle', width, height });
      }catch(err){ toast('Não foi possível processar a foto'); }
    }
    e.target.value = '';
    renderItemFotos();
  }
  camInput.onchange = handleFiles;
  galInput.onchange = handleFiles;

  zone.querySelector('#btnAddItem').onclick = ()=>{
    if(!it.bloco && !it.perguntaRef){ toast('Informe ao menos o bloco/área do item'); return; }
    if(!it.descricao){ toast('Adicione uma descrição da não conformidade'); return; }
    draft.itens.push(it);
    itemDraft = null;
    renderAndBind();
    toast('Item adicionado à auditoria');
  };
}

async function autoGerarDescricao(force){
  const it = itemDraft;
  if(!it) return;
  if(!force && it.descEditado) return; // usuário já começou a editar, não mexe automaticamente
  const zone = document.getElementById('itemDraftZone');
  const indicator = zone && zone.querySelector('#iaGeraIndicator');
  const btn = zone && zone.querySelector('#btnGerarDesc');
  if(indicator) indicator.style.display = 'flex';
  if(btn) btn.disabled = true;
  try{
    const r = await gerarDescricaoAutomatica(it);
    if(itemDraft === it){
      const descEl = document.getElementById('itDesc');
      const planoEl = document.getElementById('itPlano');
      if(force || !it.descEditado){
        it.descricao = toSentenceCase(r.descricao || it.descricao);
        if(descEl) descEl.value = it.descricao;
      }
      if(force || !it.planoEditado){
        it.planoAcao = toSentenceCase(r.planoAcao || it.planoAcao);
        if(planoEl) planoEl.value = it.planoAcao;
      }
    }
  }catch(e){
    if(e && e.code === 'SEM_CHAVE'){
      toast('Configure a chave de API em "⚙ IA" no topo da tela para usar a geração automática');
    } else if(force){
      toast('Não foi possível gerar automaticamente — preencha manualmente (' + (e.message||'erro') + ')');
    }
  }
  if(indicator) indicator.style.display = 'none';
  if(btn) btn.disabled = false;
}

function renderItemFotos(){
  const box = document.getElementById('itFotos');
  if(!box) return;
  const it = itemDraft;
  box.innerHTML = it.fotos.map((f,i)=>`
    <div class="photo-thumb">
      <img src="${f.dataUrl}">
      <button class="rm" data-rm-foto="${i}">×</button>
    </div>
  `).join('') + `<button class="photo-add" id="btnAddFotoCam" title="Tirar foto">📷</button>
    <button class="photo-add" id="btnAddFotoGal" title="Escolher da galeria">🖼️</button>`;

  box.querySelectorAll('[data-rm-foto]').forEach(b=>{
    b.onclick = ()=>{ it.fotos.splice(parseInt(b.dataset.rmFoto),1); renderItemFotos(); };
  });
  box.querySelector('#btnAddFotoCam').onclick = ()=> document.getElementById('itFotoCamInput').click();
  box.querySelector('#btnAddFotoGal').onclick = ()=> document.getElementById('itFotoGalInput').click();

  // caixa de análise IA (uma por foto, mostrando resultado ou botão)
  const zone = document.getElementById('itemDraftZone');
  let aiZone = zone.querySelector('.ai-zone-wrap');
  if(!aiZone){
    aiZone = document.createElement('div');
    aiZone.className = 'ai-zone-wrap';
    box.insertAdjacentElement('afterend', aiZone);
  }
  if(it.fotos.length === 0){ aiZone.innerHTML=''; return; }
  aiZone.innerHTML = it.fotos.map((f,i)=>{
    if(f.aiStatus === 'loading'){
      return `<div class="ai-box"><div class="lbl"><span class="spinner"></span> Analisando foto ${i+1} com IA…</div></div>`;
    }
    if(f.aiStatus === 'done'){
      return `<div class="ai-box"><div class="lbl">✓ Sugestão da IA (foto ${i+1})</div>
        <div style="font-size:12.5px;line-height:1.4;">${escapeHtml(f.aiResult.descricao)}</div>
        <div class="btn-row"><button class="btn btn-sm" data-apply-ai="${i}">Usar esta sugestão</button></div>
      </div>`;
    }
    if(f.aiStatus === 'error'){
      return `<div class="ai-box"><div class="lbl">⚠ Falha ao analisar foto ${i+1}</div>
        <div style="font-size:12px;color:var(--ink-dim);">${escapeHtml(f.aiError || '')}</div>
        <div class="btn-row"><button class="btn btn-sm" data-analyze="${i}">Tentar novamente</button></div></div>`;
    }
    return `<div class="btn-row"><button class="btn btn-sm" data-analyze="${i}">✨ Analisar foto ${i+1} com IA</button></div>`;
  }).join('');

  aiZone.querySelectorAll('[data-analyze]').forEach(b=>{
    b.onclick = async ()=>{
      const i = parseInt(b.dataset.analyze);
      it.fotos[i].aiStatus = 'loading';
      renderItemFotos();
      try{
        const result = await analisarFotoIA(it.fotos[i].dataUrl.split(',')[1], 'image/jpeg', it.perguntaRef);
        it.fotos[i].aiResult = result;
        it.fotos[i].aiStatus = 'done';
      }catch(err){
        it.fotos[i].aiStatus = 'error';
        it.fotos[i].aiError = (err && err.code === 'SEM_CHAVE') ? 'Configure a chave de API em "⚙ IA" no topo da tela' : (err.message || 'erro desconhecido');
      }
      renderItemFotos();
    };
  });
  aiZone.querySelectorAll('[data-apply-ai]').forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.applyAi);
      const r = it.fotos[i].aiResult;
      document.getElementById('itDesc').value = r.descricao; it.descricao = r.descricao; it.descEditado = true;
      document.getElementById('itPlano').value = r.planoAcao; it.planoAcao = r.planoAcao; it.planoEditado = true;
      if(r.criticidade && CRIT_ORDER.includes(r.criticidade)){
        document.getElementById('itCrit').value = r.criticidade; it.criticidade = r.criticidade;
      }
      toast('Sugestão da IA aplicada — revise antes de adicionar');
    };
  });
}

/* ===================== FINALIZAR AUDITORIA / SALVAR / PDF ===================== */
async function finalizarAuditoria(){
  if(!draft.itens.length){ toast('Adicione ao menos um item'); return; }
  const ok = confirm('Deseja enviar o relatório desta auditoria?');
  if(!ok) return;
  draft.finalizada = true;
  draft.dataFinalizacao = todayISO();

  const full = JSON.parse(JSON.stringify(draft));
  const okFull = await sSet(`auditoria:${draft.id}`, JSON.stringify(full), true);

  const idxRaw = await sGet('index:auditorias', true);
  const idx = idxRaw ? JSON.parse(idxRaw) : [];
  const counts = { CRÍTICO:0, SUBSTANCIAL:0, MODERADO:0, TRIVIAL:0 };
  draft.itens.forEach(i => counts[i.criticidade] = (counts[i.criticidade]||0)+1);
  idx.push({
    id: draft.id, unidade: draft.unidade, gerenteNome: draft.gerenteNome, consultor: draft.consultor,
    tipo: draft.tipo, data: draft.data, auditor: draft.auditor, totalItens: draft.itens.length,
    counts,
    itens: draft.itens.map(i => ({
      id: i.id, bloco: i.bloco, area: i.area, criticidade: i.criticidade, descricao: i.descricao,
      observacoes: i.observacoes
    }))
  });
  const okIdx = await sSet('index:auditorias', JSON.stringify(idx), true);

  if(!okFull || !okIdx){ toast('Atenção: houve um problema ao salvar. Tente novamente.'); }
  else{ toast('Auditoria salva com sucesso'); }

  gerarPDF(full);
  const savedDraft = draft;
  draft = newDraft();
  showShareModal(savedDraft);
}

function gerarPDF(aud){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = 595, M = 42;
  let y = 0;

  function hazardBand(yy, h=8){
    const stripeW = 14;
    doc.setFillColor(245,166,35);
    doc.rect(0, yy, W, h, 'F');
    doc.setFillColor(23,25,27);
    for(let x=-h; x<W; x+=stripeW*2){
      doc.saveGraphicsState && doc.saveGraphicsState();
      doc.setFillColor(23,25,27);
      doc.triangle(x,yy, x+stripeW,yy, x,yy+h, 'F');
    }
  }
  function critColor(c){
    return { 'CRÍTICO':[229,72,77], 'SUBSTANCIAL':[242,153,74], 'MODERADO':[210,170,40], 'TRIVIAL':[90,130,160] }[c] || [130,130,130];
  }
  function checkPage(needed){
    if(y + needed > 800){ doc.addPage(); y = 40; }
  }

  // capa
  doc.setFillColor(23,25,27); doc.rect(0,0,W,842,'F');
  hazardBand(0,10);
  doc.setTextColor(245,166,35);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('RELATÓRIO DE AUDITORIA DE CAMPO — SSMA', M, 50);
  doc.setTextColor(236,233,226);
  doc.setFontSize(26);
  doc.text(aud.unidade, M, 90);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.setTextColor(180,180,180);
  doc.text(`Gerente: ${aud.gerenteNome || '-'}`, M, 115);
  doc.text(`Consultor(a): ${aud.consultor || '-'}`, M, 132);
  doc.text(`Tipo de auditoria: ${aud.tipo}   |   Data: ${fmtDate(aud.data)}`, M, 149);
  doc.text(`Auditor: ${aud.auditor || '-'}`, M, 166);

  const counts = { CRÍTICO:0, SUBSTANCIAL:0, MODERADO:0, TRIVIAL:0 };
  aud.itens.forEach(i => counts[i.criticidade] = (counts[i.criticidade]||0)+1);
  let cy = 210;
  doc.setTextColor(245,166,35); doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('RESUMO DA AUDITORIA', M, cy); cy += 22;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(236,233,226);
  doc.text(`Total de itens verificados: ${aud.itens.length}`, M, cy); cy += 20;
  CRIT_ORDER.forEach(c=>{
    const col = critColor(c);
    doc.setFillColor(col[0],col[1],col[2]);
    doc.circle(M+4, cy-4, 4, 'F');
    doc.setTextColor(236,233,226);
    doc.text(`${c}: ${counts[c]||0}`, M+16, cy);
    cy += 18;
  });
  doc.setTextColor(140,140,140); doc.setFontSize(9);
  doc.text('Gerado automaticamente pelo Auditor SSMA de Campo', M, 800);

  // páginas de itens — agrupadas de 4 em 4 para otimizar espaço e reduzir nº de páginas
  const ITEMS_PER_PAGE = 4;
  const PAGE_BOTTOM = 800;
  let onPage = 0;

  function newItemsPage(pageLabel){
    doc.addPage();
    doc.setFillColor(255,255,255); doc.rect(0,0,W,842,'F');
    y = 36;
    hazardBand(0,5);
    doc.setTextColor(150,150,150); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text(pageLabel, M, y);
    y += 15;
    onPage = 0;
  }

  aud.itens.forEach((item, idx)=>{
    const col = critColor(item.criticidade);
    const contentW = W - 2*M;
    const descLines = doc.splitTextToSize(item.descricao || '-', contentW - 20);
    const planoLines = doc.splitTextToSize(item.planoAcao || '-', contentW - 32);
    const codigoLines = item.codigosProduto ? doc.splitTextToSize(`Peça(s)/fornecedor: ${item.codigosProduto}`, contentW - 6) : [];
    const obsLines = item.observacoes ? doc.splitTextToSize(`Obs: ${item.observacoes}`, contentW) : [];
    const hasFotos = item.fotos && item.fotos.length;
    const maxShow = hasFotos ? Math.min(4, item.fotos.length) : 0;
    const photoH = maxShow ? 48 : 0;
    const estHeight = 20 + (photoH ? photoH+6 : 0) + descLines.length*9.5+5 + planoLines.length*9.5+5 +
      (codigoLines.length ? codigoLines.length*8.5+4 : 0) + (obsLines.length ? obsLines.length*8.5+4 : 0) + 12;

    if(onPage === 0){
      newItemsPage(`NÃO CONFORMIDADES — página ${Math.floor(idx/ITEMS_PER_PAGE)+1}`);
    } else if(y + estHeight > PAGE_BOTTOM){
      newItemsPage(`NÃO CONFORMIDADES — continuação`);
    }

    // cabeçalho compacto do item
    doc.setFillColor(col[0],col[1],col[2]);
    doc.circle(M+3, y-3, 3.2, 'F');
    doc.setTextColor(30,30,30); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text(`ITEM ${idx+1}`, M+11, y);
    const w1 = doc.getTextWidth(`ITEM ${idx+1}`);
    doc.setTextColor(col[0],col[1],col[2]); doc.setFontSize(8);
    doc.text(item.criticidade, M+11+w1+6, y);
    doc.setTextColor(120,120,120); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text(`${item.bloco || ''}${item.area ? ' · '+item.area : ''}`, M, y+10);
    y += 18;

    if(hasFotos){
      const gap = 4;
      const CELL_MAX_W = 145;
      const cellW = Math.min((contentW - gap*(maxShow-1)) / maxShow, CELL_MAX_W);
      let x = M;
      for(let k=0;k<maxShow;k++){
        const f = item.fotos[k];
        const natW = f.width || 800, natH = f.height || 600;
        const scale = Math.min(cellW/natW, photoH/natH);
        const drawW = natW*scale, drawH = natH*scale;
        const offX = x + (cellW-drawW)/2, offY = y + (photoH-drawH)/2;
        doc.setFillColor(240,240,240);
        doc.roundedRect(x, y, cellW, photoH, 2, 2, 'F');
        try{ doc.addImage(f.dataUrl, 'JPEG', offX, offY, drawW, drawH); }catch(e){}
        x += cellW + gap;
      }
      if(item.fotos.length > maxShow){
        doc.setFontSize(7); doc.setTextColor(140,140,140);
        doc.text(`+${item.fotos.length-maxShow}`, x+2, y+photoH-4);
      }
      y += photoH + 6;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(30,30,30);
    doc.text('NC:', M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(40,40,40);
    doc.text(descLines, M+18, y);
    y += descLines.length*9.5 + 5;

    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(30,30,30);
    doc.text('AÇÃO:', M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(40,40,40);
    doc.text(planoLines, M+28, y);
    y += planoLines.length*9.5 + 5;

    if(codigoLines.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(100,100,100);
      doc.text(codigoLines, M, y);
      y += codigoLines.length*8.5 + 4;
    }

    if(obsLines.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
      doc.text(obsLines, M, y);
      y += obsLines.length*8.5 + 4;
    }

    onPage++;
    if(onPage >= ITEMS_PER_PAGE){
      onPage = 0;
    } else if(idx < aud.itens.length-1){
      doc.setDrawColor(226,226,226); doc.setLineWidth(0.6);
      doc.line(M, y+2, W-M, y+2);
      y += 12;
    }
  });

  doc.save(`Auditoria_SSMA_${aud.unidade}_${aud.data}.pdf`);
  window._lastPdfBlob = doc.output('blob');
  window._lastPdfName = `Auditoria_SSMA_${aud.unidade}_${aud.data}.pdf`;
}

function showShareModal(aud){
  const counts = { CRÍTICO:0, SUBSTANCIAL:0, MODERADO:0, TRIVIAL:0 };
  aud.itens.forEach(i => counts[i.criticidade] = (counts[i.criticidade]||0)+1);
  const resumo = `Auditoria SSMA — ${aud.unidade}\nData: ${fmtDate(aud.data)} | Tipo: ${aud.tipo}\nGerente: ${aud.gerenteNome}\nTotal de itens: ${aud.itens.length} (Críticos: ${counts.CRÍTICO||0})\nRelatório em PDF anexo/baixado no dispositivo.`;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>Auditoria finalizada ✓</h3>
      <p style="font-size:13px;color:var(--ink-dim);line-height:1.5;">
        O PDF foi baixado no seu dispositivo. Compartilhe pelo app desejado abaixo — se o seu navegador suportar
        compartilhamento de arquivos, o PDF já vai anexado.
      </p>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="btnShareNative">Compartilhar PDF</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-block" id="btnShareWA">WhatsApp (texto)</button>
        <button class="btn btn-block" id="btnShareMail">Outlook / E-mail</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-block" id="btnCloseShare">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#btnShareNative').onclick = async ()=>{
    try{
      const file = new File([window._lastPdfBlob], window._lastPdfName, { type:'application/pdf' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:'Relatório de Auditoria SSMA', text: resumo });
      } else {
        toast('Seu navegador não suporta anexar o PDF automaticamente. Use os botões abaixo e anexe o arquivo já baixado.');
      }
    }catch(e){ /* usuário cancelou */ }
  };
  overlay.querySelector('#btnShareWA').onclick = ()=>{
    window.open(`https://wa.me/?text=${encodeURIComponent(resumo)}`, '_blank');
  };
  overlay.querySelector('#btnShareMail').onclick = ()=>{
    window.open(`mailto:?subject=${encodeURIComponent('Relatório de Auditoria SSMA — '+aud.unidade)}&body=${encodeURIComponent(resumo)}`, '_blank');
  };
  overlay.querySelector('#btnCloseShare').onclick = ()=>{ overlay.remove(); switchView('dashboard'); };
}

/* ===================== VIEW: PENDÊNCIAS ===================== */
async function getIndex(){
  const raw = await sGet('index:auditorias', true);
  return raw ? JSON.parse(raw) : [];
}
async function saveIndex(idx){
  return sSet('index:auditorias', JSON.stringify(idx), true);
}

function scopeFilter(idx){
  if(!PROFILE) return idx;
  if(PROFILE.papel === 'gestor') return idx;
  if(PROFILE.papel === 'consultor') return idx.filter(a => a.consultor === PROFILE.consultor);
  if(PROFILE.papel === 'gerente') return idx.filter(a => a.unidade === PROFILE.unidade);
  return idx;
}

async function renderPendingView(){
  if(!PROFILE){
    return `<div class="empty"><div class="ic">👤</div><p>Defina seu perfil no topo da tela para ver as oportunidades da sua unidade ou território.</p></div>`;
  }
  const idx = scopeFilter(await getIndex());
  const oportunidades = [];
  idx.forEach(aud => {
    aud.itens.forEach(it => {
      oportunidades.push({ ...it, unidade: aud.unidade, gerenteNome: aud.gerenteNome, dataAud: aud.data });
    });
  });
  const critRank = c => CRIT_ORDER.indexOf(c);
  oportunidades.sort((a,b)=> critRank(a.criticidade) - critRank(b.criticidade) || (b.dataAud||'').localeCompare(a.dataAud||''));

  if(!oportunidades.length){
    return `<div class="empty"><div class="ic">🔎</div><p>Nenhuma oportunidade identificada ainda no seu escopo.</p></div>`;
  }

  return `
    <div class="card">
      <h2>Oportunidades identificadas <span class="n">${oportunidades.length}</span></h2>
      ${oportunidades.map(p => `
        <div class="pending-item">
          <div class="top">
            <div>
              <div class="unit">${escapeHtml(p.unidade)}</div>
              <span class="badge badge-${p.criticidade}">${p.criticidade}</span>
            </div>
          </div>
          <div class="desc">${escapeHtml(p.descricao || p.bloco)}</div>
          ${p.observacoes ? `<div class="desc" style="color:var(--ink-dim);font-size:12.5px;">Obs: ${escapeHtml(p.observacoes)}</div>` : ''}
          <div class="meta-row">
            <span>Bloco: ${escapeHtml(p.bloco)}</span>
            <span>Gerente: ${escapeHtml(p.gerenteNome||'—')}</span>
            <span>Auditoria: ${fmtDate(p.dataAud)}</span>
          </div>
        </div>`
      ).join('')}
    </div>
  `;
}

function bindPendingEvents(){}

/* ===================== VIEW: PAINEL GERENCIAL ===================== */
async function renderDashboardView(){
  const idx = scopeFilter(await getIndex());
  if(!idx.length){
    return `<div class="empty"><div class="ic">📊</div><p>Nenhuma auditoria registrada ainda no seu escopo.<br>Os indicadores aparecem aqui assim que a primeira auditoria for finalizada.</p></div>`;
  }
  let totalItens=0, criticos=0, substanciais=0, moderados=0, triviais=0;
  const porUnidade = {};
  idx.forEach(aud=>{
    if(!porUnidade[aud.unidade]) porUnidade[aud.unidade] = { total:0, criticos:0 };
    aud.itens.forEach(it=>{
      totalItens++;
      porUnidade[aud.unidade].total++;
      if(it.criticidade === 'CRÍTICO'){ criticos++; porUnidade[aud.unidade].criticos++; }
      if(it.criticidade === 'SUBSTANCIAL') substanciais++;
      if(it.criticidade === 'MODERADO') moderados++;
      if(it.criticidade === 'TRIVIAL') triviais++;
    });
  });

  const maiorTotal = Math.max(1, ...Object.values(porUnidade).map(v=>v.total));
  const ranking = Object.entries(porUnidade)
    .map(([u,v])=>({ unidade:u, total:v.total, criticos:v.criticos }))
    .sort((a,b)=> b.total - a.total);

  return `
    <div class="card">
      <h2>Indicadores gerais</h2>
      <div class="kpi-grid">
        <div class="kpi"><div class="val">${idx.length}</div><div class="lbl">Auditorias realizadas</div></div>
        <div class="kpi"><div class="val">${totalItens}</div><div class="lbl">Oportunidades identificadas</div></div>
        <div class="kpi"><div class="val" style="color:var(--crit)">${criticos}</div><div class="lbl">Críticas</div></div>
        <div class="kpi"><div class="val" style="color:var(--subst)">${substanciais}</div><div class="lbl">Substanciais</div></div>
        <div class="kpi"><div class="val" style="color:var(--mod)">${moderados}</div><div class="lbl">Moderadas</div></div>
        <div class="kpi"><div class="val" style="color:var(--triv)">${triviais}</div><div class="lbl">Triviais</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Ranking de unidades <span class="n">nº de oportunidades identificadas</span></h2>
      ${ranking.map((r,i)=>`
        <div class="rank-row">
          <span class="pos">${i+1}º</span>
          <span class="name">${escapeHtml(r.unidade)}</span>
          <div class="bar-bg"><div class="bar-fg" style="width:${Math.round((r.total/maiorTotal)*100)}%;background:${r.criticos>0?'var(--crit)':'var(--mod)'}"></div></div>
          <span class="pct">${r.total}</span>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <h2>Backup dos dados</h2>
      <p style="font-size:12px;color:var(--ink-dim);line-height:1.5;margin:0 0 10px;">
        Os dados ficam salvos neste aparelho. Exporte um backup regularmente e use "Importar" para
        levar as auditorias para outro celular ou juntar o que cada consultor(a) registrou.
      </p>
      <div class="btn-row">
        <button class="btn btn-block" id="btnExportBackup">Exportar backup</button>
        <button class="btn btn-block" id="btnImportBackup">Importar backup</button>
      </div>
      <input type="file" accept="application/json" id="importBackupInput" style="display:none">
    </div>
  `;
}

/* ===================== VIEW: HISTÓRICO ===================== */
async function renderHistoryView(){
  const idx = scopeFilter(await getIndex());
  if(!idx.length){
    return `<div class="empty"><div class="ic">🗂️</div><p>Nenhuma auditoria no histórico ainda.</p></div>`;
  }
  const porUnidade = {};
  idx.forEach(a => { (porUnidade[a.unidade] = porUnidade[a.unidade]||[]).push(a); });
  Object.values(porUnidade).forEach(list => list.sort((a,b)=> a.data.localeCompare(b.data)));

  return Object.entries(porUnidade).map(([unidade, list])=>`
    <div class="card">
      <h2>${escapeHtml(unidade)} <span class="n">${list.length} auditoria(s)</span></h2>
      ${list.map(a=>{
        const criticos = a.itens.filter(i=>i.criticidade==='CRÍTICO').length;
        return `
        <div class="pending-item">
          <div class="top">
            <div>
              <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);">${fmtDate(a.data)} · ${escapeHtml(a.tipo)}</div>
              <div style="font-size:13.5px;margin-top:4px;">${a.totalItens} itens · ${criticos} críticos</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-sm" data-view-pdf="${a.id}">Ver PDF</button>
              <button class="btn btn-sm btn-danger" data-del-aud="${a.id}">Excluir</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function bindHistoryEvents(){
  document.querySelectorAll('[data-view-pdf]').forEach(b=>{
    b.onclick = async ()=>{
      const raw = await sGet(`auditoria:${b.dataset.viewPdf}`);
      if(raw) gerarPDF(JSON.parse(raw));
      else toast('Não foi possível carregar esta auditoria');
    };
  });
  document.querySelectorAll('[data-del-aud]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir esta auditoria e todas as oportunidades registradas nela? Essa ação não pode ser desfeita.')) return;
      const id = b.dataset.delAud;
      const idx = await getIndex();
      await saveIndex(idx.filter(a => a.id !== id));
      await sDelete(`auditoria:${id}`);
      toast('Auditoria excluída');
      switchView('history');
    };
  });
}

/* ===================== BIND DISPATCH / INIT ===================== */
function bindDashboardEvents(){
  const be = document.getElementById('btnExportBackup');
  if(be) be.onclick = exportBackup;
  const bi = document.getElementById('btnImportBackup');
  const fi = document.getElementById('importBackupInput');
  if(bi && fi){
    bi.onclick = ()=> fi.click();
    fi.onchange = async ()=>{
      if(fi.files[0]){ await importBackupFile(fi.files[0]); switchView('dashboard'); }
    };
  }
}

function bindViewEvents(view){
  if(view === 'audit') bindAuditView();
  if(view === 'pending') bindPendingEvents();
  if(view === 'history') bindHistoryEvents();
  if(view === 'dashboard') bindDashboardEvents();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

(async function init(){
  await loadProfile();
  renderProfileLine();
  await switchView('audit');
})();

</script>
