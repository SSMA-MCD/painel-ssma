<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Fornecedores — SSMA</title>
<style>
  :root{
    --red:#d5261c;
    --red-deep:#a11a13;
    --gold:#ffc72c;
    --gold-deep:#e0a713;
    --cream:#fff8ec;
    --card:#ffffff;
    --ink:#2b2320;
    --ink-soft:#7a6f65;
    --line:#f0e2c8;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(213,38,28,.06) 1.5px, transparent 0);
    background-size:22px 22px;
  }

  /* ---------- header ---------- */
  header{
    background:var(--red);
    background-image:linear-gradient(180deg,#e2372c 0%, var(--red) 55%, var(--red-deep) 100%);
    color:#fff;
    padding:22px 16px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 6px 18px rgba(161,26,19,.28);
    border-bottom:4px solid var(--gold);
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:4px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  header h1{
    margin:0 0 3px;
    font-size:22px;
    font-weight:900;
    letter-spacing:.2px;
    font-family:Georgia,"Times New Roman",serif;
    text-transform:uppercase;
  }
  header p{
    margin:0 0 14px;
    font-size:12.5px;
    color:#ffe1b8;
    font-weight:500;
  }
  .search{
    display:flex;
    align-items:center;
    background:#fff;
    border:2px solid var(--gold);
    border-radius:12px;
    padding:10px 13px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
  }
  .search svg{flex:0 0 auto;margin-right:8px;color:var(--red);}
  .search input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-size:15px;
    width:100%;
    font-weight:600;
  }
  .search input::placeholder{color:#c7b9a8;font-weight:500;}

  /* ---------- filter chips ---------- */
  .chips{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:13px 16px 4px;
    -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--line);
    background:#fff;
    font-size:12.5px;
    font-weight:800;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:.15s;
  }
  .chip.active{
    background:var(--gold);
    border-color:var(--gold-deep);
    color:#3a2500;
    box-shadow:0 2px 6px rgba(224,167,19,.4);
  }
  .count-bar{
    padding:10px 16px 0;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .count-bar::before{
    content:"";
    width:16px;height:2px;
    background:var(--gold-deep);
    display:inline-block;
  }

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
    gap:9px;
    padding:12px 16px 44px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    transition:transform .12s, box-shadow .12s;
  }
  .card:active{ transform:scale(.97); }
  .card .num{
    position:absolute;
    top:6px;
    left:6px;
    background:var(--red);
    color:#fff;
    font-size:9px;
    font-weight:800;
    padding:2px 6px;
    border-radius:999px;
    z-index:2;
    letter-spacing:.3px;
  }
  .card .thumb{
    background:#fbf6ea;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }
  .card .thumb img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  .card .info{
    padding:7px 8px 9px;
    border-top:2px solid var(--gold);
  }
  .card .tag{
    display:inline-block;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:var(--red-deep);
    margin-bottom:3px;
  }
  .card .desc{
    font-size:11.5px;
    font-weight:700;
    line-height:1.25;
    color:var(--ink);
    margin-bottom:3px;
    min-height:28px;
  }
  .card .code{
    font-size:10.5px;
    color:var(--ink-soft);
    font-family:"SF Mono",Consolas,monospace;
  }
  .card .code b{
    color:var(--red-deep);
    font-weight:800;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-weight:600;
  }
  footer{
    text-align:center;
    padding:18px 16px 30px;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
  }
  @media (min-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">SSMA</div>
  <h1>Book Fornecedores</h1>
  <p id="subtitle">carregando catálogo...</p>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar por código ou descrição...">
  </div>
</header>

<div class="chips" id="chips"></div>
<div class="count-bar" id="countBar"></div>
<div class="grid" id="grid"></div>

const fornecedores = [...new Set(ITEMS.map(i => i.fornecedor_display))].sort();
let activeFilter = "TODOS";
let searchTerm = "";

// remove acentos e caixa alta, pra busca não depender de acentuação exata
function normalize(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
}

// grupos de termos do mesmo segmento: buscar um encontra os outros também
const SYNONYM_GROUPS = [
  ["CALCADO","SAPATO","SAPATOS","BOTA","BOTAS","TENIS","SANDALIA","STICKY SHOE"],
  ["OCULOS","LENTE","LENTES"],
  ["LUVA","LUVAS"],
  ["CAPACETE","CARNEIRA"],
  ["EXTINTOR","PO QUIMICO","CO2"],
  ["PLACA","PLACAS","SINALIZACAO","AVISO"],
  ["PROTETOR AUDITIVO","ABAFADOR","CONCHA"],
  ["RESPIRADOR","MASCARA","FILTRO"],
  ["CADEIRA","BANCO","MOCHO","ASSENTO"],
  ["AVENTAL","CAPA"],
];

function expandTerm(term){
  const set = new Set([term]);
  for(const group of SYNONYM_GROUPS){
    const hit = group.some(g => g.includes(term) || term.includes(g));
    if(hit){ group.forEach(g => set.add(g)); }
  }
  return [...set];
}
function wordMatch(text, token){
  if(token.includes(" ")) return text.includes(token); // frases: mantém substring
  const re = new RegExp("(^|[^A-Z0-9])" + token + "([^A-Z0-9]|$)");
  return re.test(text);
}

const chipsEl = document.getElementById("chips");
const gridEl = document.getElementById("grid");
const countBarEl = document.getElementById("countBar");
const subtitleEl = document.getElementById("subtitle");

subtitleEl.textContent = `${ITEMS.length} itens catalogados · ${fornecedores.length} fornecedores`;

function renderChips(){
  const all = ["TODOS", ...fornecedores];
  chipsEl.innerHTML = all.map(f =>
    `<div class="chip ${f===activeFilter?'active':''}" data-f="${f}">${f}${f!=="TODOS" ? ' ('+ITEMS.filter(i=>i.fornecedor_display===f).length+')' : ''}</div>`
  ).join("");
  chipsEl.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => {
      activeFilter = el.dataset.f;
      renderChips();
      renderGrid();
    });
  });
}

function renderGrid(){
  const term = normalize(searchTerm.trim());
  const expanded = term ? expandTerm(term) : [];
  const filtered = ITEMS.filter(i => {
    const matchesFilter = activeFilter === "TODOS" || i.fornecedor_display === activeFilter;
    const descNorm = normalize(i.descricao);
    const codNorm = normalize(i.codigo);
    const matchesSearch = !term || descNorm.includes(term) || codNorm.includes(term) ||
      expanded.some(t => t !== term && (wordMatch(descNorm, t) || wordMatch(codNorm, t)));
    return matchesFilter && matchesSearch;
  });

  countBarEl.textContent = `${filtered.length} item${filtered.length===1?'':'s'} encontrado${filtered.length===1?'':'s'}`;

  if(filtered.length === 0){
    gridEl.innerHTML = `<div class="empty" style="grid-column:1/-1">Nenhum item encontrado. Tente outro termo de busca.</div>`;
    return;
  }

  gridEl.innerHTML = filtered.map((i, idx) => `
    <div class="card">
      <div class="num">${String(idx+1).padStart(3,'0')}</div>
      <div class="thumb"><img src="${i.img}" loading="lazy" alt="${i.descricao}"></div>
      <div class="info">
        <span class="tag">${i.fornecedor_display}</span>
        <div class="desc">${i.descricao}</div>
        <div class="code"><b>Cod:</b> ${i.codigo || '—'}</div>
      </div>
    </div>
  `).join("");
}

document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderGrid();
});

renderChips();
renderGrid();
</script>
